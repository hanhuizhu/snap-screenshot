<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Snap 控制台</title>
  <link rel="stylesheet" href="apidebug.css" />
  <link rel="stylesheet" href="calendar.css" />
  <link rel="stylesheet" href="drafts.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: row;
      font: 13px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      color: #1d1d1f;
      background: #fbfbfd;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e8e8ea; background: #1e1e20; }
      nav.side { background: #232326 !important; border-color: #38383c !important; }
      nav.side button { color: #c8c8cc !important; }
      nav.side button:hover { background: rgba(255,255,255,.08) !important; }
      nav.side button.on { color: #fff !important; }
      .card { background: #2a2a2d !important; border-color: #38383c !important; }
      .muted { color: #9a9aa0 !important; }
    }

    /* 导航放侧边栏，不再占顶部一行 */
    nav.side {
      flex: none;
      width: 150px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 10px 8px;
      background: #f5f5f7;
      border-right: 1px solid #e6e6ea;
      overflow: auto;
    }
    nav.side button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: none;
      border-radius: 7px;
      background: none;
      color: #4b4b50;
      cursor: grab;
      font: inherit;
      text-align: left;
      white-space: nowrap;
      touch-action: none;
    }
    nav.side button:hover { background: rgba(128,128,128,.14); }
    nav.side button.on { background: #1677ff; color: #fff; font-weight: 600; }
    /* 拖动手柄：悬停时浮现，提示可以排序 */
    nav.side button::after {
      content: '⠿';
      margin-left: auto;
      font-size: 11px;
      line-height: 1;
      opacity: 0;
      transition: opacity .12s;
    }
    nav.side button:hover::after, nav.side button.on::after { opacity: .35; }
    nav.side button.dragging {
      opacity: .45;
      cursor: grabbing;
      background: rgba(128,128,128,.14);
    }
    nav.side button.dragging::after { opacity: .6; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    .view { display: none; flex: 1 1 auto; min-height: 0; }
    .view.on { display: block; overflow: auto; }
    #view-api.on, #view-cal.on, #view-drafts.on { display: flex; overflow: hidden; }
    #api-root, #cal-root, #drafts-root { flex: 1; min-height: 0; }

    /* 窗口可以拉得很宽；说明页的正文保持一个可读的栏宽 */
    .wrap { padding: 20px 24px 26px; max-width: 820px; margin: 0 auto; }
    h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: .2px; }
    h2 { font-size: 13px; margin: 20px 0 8px; }
    .muted { color: #86868b; }
    .card {
      background: #fff;
      border: 1px solid #e6e6ea;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 10px;
    }
    .row { display: flex; align-items: center; gap: 10px; }
    .row + .row { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(128,128,128,.16); }
    .row.nolined { margin-top: 6px; padding-top: 0; border-top: none; }
    .grow { flex: 1; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .ok { background: #30d158; }
    .bad { background: #ff9f0a; }
    button.act {
      font: inherit;
      font-size: 12px;
      padding: 4px 11px;
      border-radius: 6px;
      border: 1px solid rgba(128,128,128,.3);
      background: rgba(128,128,128,.1);
      color: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    button.act:hover { background: rgba(128,128,128,.2); }
    button.act:disabled { opacity: .45; cursor: default; }
    .hotkey { font-size: 15px; font-weight: 600; }
    .check { cursor: pointer; }
    .check input[type="checkbox"] {
      width: 16px; height: 16px; margin: 0; flex: none;
      accent-color: #1677ff; cursor: pointer;
    }
    .check input[type="checkbox"]:disabled { cursor: default; opacity: .5; }
    .pill {
      font-size: 11px; padding: 2px 8px; border-radius: 20px; flex: none;
      background: rgba(128,128,128,.16); color: inherit;
    }
    .pill.on { background: rgba(48,209,88,.18); color: #1f9d55; }
    @media (prefers-color-scheme: dark) { .pill.on { color: #4ade80; } }
  </style>
</head>
<body>
  <nav class="side" id="tabs">
    <button class="on" data-view="cal" title="拖动可调整顺序">日历</button>
    <button data-view="drafts" title="拖动可调整顺序">草稿</button>
    <button data-view="api" title="拖动可调整顺序">API 调试台</button>
    <button data-view="help" title="拖动可调整顺序">设置</button>
  </nav>

  <div class="main">
    <section id="view-cal" class="view on">
      <div id="cal-root" class="cal"></div>
    </section>

    <section id="view-drafts" class="view">
      <div id="drafts-root" class="drafts"></div>
    </section>

    <main id="view-help" class="view">
      <div class="wrap">
        <h1>Snap 截图</h1>
        <div class="muted">微信截图同款交互 · 框选、智能识别、标注、贴图</div>

        <div class="card">
          <div class="row">
            <span class="grow">截图快捷键（全局，随时可用）</span>
            <span class="hotkey" id="hotkey">⌃ ⌘ A</span>
          </div>
          <div class="row nolined">
            <span class="muted">截图只能由快捷键拉起：点菜单栏图标只会打开这个控制台，不会开始截图。</span>
          </div>
        </div>

        <h2>权限</h2>
        <div class="card">
          <div class="row">
            <span class="dot" id="dot-screen"></span>
            <span class="grow">
              <b>屏幕录制</b><br />
              <span class="muted" id="status-screen">检查中…</span>
            </span>
            <button class="act" id="btn-screen">打开系统设置</button>
          </div>
          <div class="row">
            <span class="dot" id="dot-ax"></span>
            <span class="grow">
              <b>辅助功能</b><br />
              <span class="muted" id="status-ax">检查中…</span>
            </span>
            <button class="act" id="btn-ax">打开系统设置</button>
          </div>
          <div class="muted" id="perm-note" style="margin-top:10px">
            没有屏幕录制权限时，截图只会拍到桌面壁纸；没有辅助功能权限时，智能识别只能识别到整扇窗口，
            无法精确到按钮/文字等控件。授权后<strong>需要重新启动 Snap</strong>。
          </div>
        </div>

        <h2>设置</h2>
        <div class="card">
          <label class="row check" id="row-awake">
            <input type="checkbox" id="chk-awake" />
            <span class="grow">
              <b>保持屏幕常亮</b><br />
              <span class="muted">勾选后桌面不会息屏、不会进入睡眠（适合演示、看文档、盯盘）</span>
            </span>
            <span class="pill" id="pill-awake">关闭</span>
          </label>
          <label class="row check" id="row-login">
            <input type="checkbox" id="chk-login" />
            <span class="grow">
              <b>开机自动启动</b><br />
              <span class="muted" id="login-note">登录 macOS 后自动在后台运行，随时按快捷键截图</span>
            </span>
            <button class="act" id="btn-login-items" hidden>去允许</button>
          </label>
        </div>
      </div>
    </main>

    <section id="view-api" class="view">
      <div id="api-root" class="api"></div>
    </section>
  </div>

  <script src="calendar.js"></script>
  <script src="drafts.js"></script>
  <script src="apidebug.js"></script>
  <script src="panel.js"></script>
</body>
</html>
