<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Snap</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="stage">
    <img id="shot" alt="" draggable="false" />
    <canvas id="fx"></canvas>

    <canvas id="mag" hidden></canvas>
    <div id="maginfo" hidden>
      <span id="magswatch"></span>
      <span id="maghex">#000000</span>
      <span id="magpos">0, 0</span>
      <span id="magsize" hidden>0 × 0</span>
    </div>

    <div id="sizechip" hidden>0 × 0</div>

    <div id="toolbar" hidden>
      <div class="tb-row" id="tb-main">
        <button class="tbtn" data-tool="rect"    data-tip="矩形"></button>
        <button class="tbtn" data-tool="ellipse" data-tip="椭圆"></button>
        <button class="tbtn" data-tool="arrow"   data-tip="箭头"></button>
        <button class="tbtn" data-tool="pen"     data-tip="画笔"></button>
        <button class="tbtn" data-tool="mosaic"  data-tip="马赛克"></button>
        <button class="tbtn" data-tool="text"    data-tip="文字"></button>
        <span class="tb-sep"></span>
        <button class="tbtn" data-act="undo" data-tip="撤销 ⌘Z"></button>
        <button class="tbtn" data-act="redo" data-tip="重做 ⇧⌘Z"></button>
        <span class="tb-sep"></span>
        <button class="tbtn" data-act="pin"    data-tip="钉在屏幕"></button>
        <button class="tbtn" data-act="save"   data-tip="保存 ⌘S"></button>
        <button class="tbtn" data-act="copy"   data-tip="复制 ⌘C / ⏎"></button>
        <button class="tbtn tbtn-x" data-act="cancel" data-tip="取消 Esc"></button>
      </div>
      <div class="tb-row tb-sub" id="tb-sub" hidden>
        <div class="swatches" id="swatches"></div>
        <span class="tb-sep"></span>
        <div class="widths" id="widths"></div>
      </div>
    </div>

    <div id="toast" hidden></div>
    <div id="measure" aria-hidden="true"></div>
  </div>

  <script src="icons.js"></script>
  <script src="ops.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
